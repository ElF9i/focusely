services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: focusely
      POSTGRES_USER: focusely
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusely -d focusely"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
