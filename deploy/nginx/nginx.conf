# Reverse proxy HTTPS devant l'API (reseau local). Certificat : voir docs/INSTALLATION.md
events {}
http {
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/focusely.crt;
    ssl_certificate_key /etc/nginx/certs/focusely.key;
    client_max_body_size 5m;

    location / {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket (SignalR, plus tard)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}